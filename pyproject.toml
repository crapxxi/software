[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "expense-tracker"
version = "0.1.0"
requires-python = ">=3.9"

[project.scripts]
expense-tracker = "expense_tracker.cli:main"

[tool.setuptools]
packages = ["expense_tracker"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py39"
